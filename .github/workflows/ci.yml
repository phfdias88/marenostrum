name: CI

# Gate mínimo em PRs (e pushes) pra main. Objetivo: barrar ANTES do deploy os
# erros que hoje só aparecem em produção — import quebrado / migration ruim
# viram restart-loop no VPS, e erro de tipo/lint some no build local.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs antigos do mesmo ref quando chega push novo (economiza minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instala dependências (app + dev)
        run: pip install -r requirements-dev.txt
      - name: Testes (SQLite in-memory, sem Docker)
        run: pytest -q

  frontend:
    name: Frontend (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instala dependências (npm ci)
        run: npm ci
      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit
      # NOTA: `next lint` NÃO entra aqui ainda — o ESLint nunca foi configurado
      # no projeto (o script `npm run lint` dispara o wizard interativo). Setar
      # um .eslintrc (next/core-web-vitals) e ligar o lint no CI é um follow-up
      # pequeno do tema de qualidade — feito à parte pra não nascer vermelho.
